<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-primary">

        <div class="container-fluid">
                  
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="home.html">Home</a>
                </li>
                <li class="nav-item text-white">
                    <a class="nav-link text-white" href="about.html">About</a>
                </li>
                <li class="nav-item text-white">
                    <a class="nav-link text-white" href="contact-us.html">Contact us</a>
                </li>
                <li class="nav-item text-white">
                    <a class="nav-link text-white" href="Login.html">Log In</a>
                </li>
                <li class="nav-item text-white">
                    <a class="nav-link bg-dark text-white" href="sign-up.html">Sign Up</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form action="home.html" method="post"> 
                    <div class="form-group">
                        <label for="">User Name</label>
                        <input type="username" class="form-control" placeholder="Username" >
                    </div>
                    <div class="form-group">                
                        <label for="">Password</label>
                        <input type="password" class="form-control" placeholder="Password" >
                    </div>
                    <div class="form-group">
                        <label for="">First Name</label>
                        <input type="text" class="form-control" placeholder="First Name" >
                    </div>
                    <div class="form-group">
                        <label for="">Middle Name</label>
                        <input type="text" class="form-control" placeholder="Middle Name">
                    </div>
                    <div class="form-group">
                        <label for="">Last Name</label>
                        <input type="text" class="form-control" placeholder="Last Name" >
                    </div>
                    <div class="form-group mb-2">
                        <label for="">Email</label>
                        <input type="email" class="form-control" placeholder="example@gmail.com" >
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a class="btn btn-default" href="Index.html">Cancel</a>            
                </form>
            </div>
        
        </div>
        

    </div>
</body>
</html>
